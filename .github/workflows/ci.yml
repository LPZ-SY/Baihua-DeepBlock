name: offline-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q src experiments app.py
      - name: Offline tests
        env:
          QUAFU_API_TOKEN: ""
          QPU_API_TOKEN: ""
        run: python -m pytest -q
